<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>XVF3800 programming paths: XTAG or ESP32-S3</title><desc>Path A: an XTAG4 on the 1.8 V JTAG header loads firmware through the XVF3800 into its flash. Path B: with jumper JP701 fitted, the ESP32-S3 holds the XVF3800 in reset through Q701, connects to the flash through four TS5A3166 switches and writes the image directly over SPI2, then lets go and releases reset.</desc>
<style>
  .bg { fill: #ffffff; }
  text { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', Arial, sans-serif; fill: #1f2328; }
  .t  { font-size: 14px; font-weight: 600; }
  .s  { font-size: 11.5px; fill: #3d444d; }
  .xs { font-size: 10px; fill: #57606a; }
  .h1 { font-size: 20px; font-weight: 700; }
  .h2 { font-size: 13px; font-weight: 600; fill: #57606a; letter-spacing: 0.04em; }
  .wire { stroke: #57606a; stroke-width: 1.4; fill: none; }
  .wire.dash { stroke-dasharray: 5 4; }
  .wire.pwr { stroke: #0f766e; stroke-width: 2; }
  .wire.sig { stroke: #1d4ed8; }
  .wire.aud { stroke: #c2410c; }
  .wire.mcu { stroke: #7e22ce; }
  .wire.prg { stroke: #be185d; }
  .lbl { font-size: 10.5px; fill: #3d444d; }
  .box { stroke-width: 1.2; }
  .k-pwr  { fill: #e6f4f1; stroke: #0f766e; }
  .k-xvf  { fill: #e8efff; stroke: #1d4ed8; }
  .k-mcu  { fill: #f3e8ff; stroke: #7e22ce; }
  .k-aud  { fill: #fff1e8; stroke: #c2410c; }
  .k-mic  { fill: #e9f7e6; stroke: #2f7d1f; }
  .k-ui   { fill: #fff7db; stroke: #a16207; }
  .k-prg  { fill: #fde8f1; stroke: #be185d; }
  .k-gry  { fill: #f2f3f5; stroke: #6e7781; }
  .k-dnp  { fill: #ffffff; stroke: #6e7781; stroke-dasharray: 4 3; }
  .note   { fill: #fffbea; stroke: #d4a72c; stroke-width: 1; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#57606a"/></marker></defs><rect class="bg" x="0" y="0" width="1100" height="720"/><text class="h1" x="30" y="28" text-anchor="start" dominant-baseline="central">MindSpeak rev 1: two ways to load XVF3800 firmware</text>
<text class="s" x="30" y="52" text-anchor="start" dominant-baseline="central">JP701 OFF (default): ESP32 is cut off from the flash, XTAG works as normal. JP701 ON: the ESP32 can write the flash.</text>
<rect class="box k-xvf" x="420" y="250" width="220" height="120" rx="8"/>
<text class="t" x="530.0" y="295.0" text-anchor="middle" dominant-baseline="central">XVF3800</text>
<text class="s" x="530.0" y="313.0" text-anchor="middle" dominant-baseline="central">boots from QSPI flash</text>
<text class="s" x="530.0" y="328.0" text-anchor="middle" dominant-baseline="central">boot straps 59, 60, 1</text>
<rect class="box k-gry" x="420" y="520" width="220" height="80" rx="8"/>
<text class="t" x="530.0" y="552.5" text-anchor="middle" dominant-baseline="central">W25Q32JVUUIQ</text>
<text class="s" x="530.0" y="570.5" text-anchor="middle" dominant-baseline="central">XVF3800 boot flash</text>
<path class="wire sig" d="M470 372 L470 518" marker-end="url(#ah)"/>
<text class="lbl" x="462" y="435" text-anchor="end" dominant-baseline="central">3 CS · 5 CLK</text>
<text class="lbl" x="462" y="451" text-anchor="end" dominant-baseline="central">59 D0 · 1 D1</text>
<text class="lbl" x="462" y="467" text-anchor="end" dominant-baseline="central">(+ 60, 2)</text>
<text class="h2" x="40" y="100" text-anchor="start" dominant-baseline="central">Path A: XTAG4 (XMOS tools)</text>
<rect class="box k-gry" x="40" y="120" width="180" height="70" rx="8"/>
<text class="t" x="130.0" y="147.5" text-anchor="middle" dominant-baseline="central">PC + XTC tools</text>
<text class="s" x="130.0" y="165.5" text-anchor="middle" dominant-baseline="central">xflash</text>
<rect class="box k-prg" x="240" y="120" width="160" height="70" rx="8"/>
<text class="t" x="320.0" y="147.5" text-anchor="middle" dominant-baseline="central">XTAG4</text>
<text class="s" x="320.0" y="165.5" text-anchor="middle" dominant-baseline="central">XMOS debug adapter</text>
<rect class="box k-prg" x="40" y="280" width="300" height="80" rx="8"/>
<text class="t" x="190.0" y="305.0" text-anchor="middle" dominant-baseline="central">JTAG header (1.8 V)</text>
<text class="s" x="190.0" y="323.0" text-anchor="middle" dominant-baseline="central">24 TCK · 23 TMS · 18 TDI · 20 TDO</text>
<text class="s" x="190.0" y="338.0" text-anchor="middle" dominant-baseline="central">21 RST_N</text>
<path class="wire prg" d="M220 155 L238 155" marker-end="url(#ah)"/>
<path class="wire prg" d="M320 190 L320 230 L190 230 L190 278" marker-end="url(#ah)"/>
<path class="wire prg" d="M340 320 L418 320" marker-end="url(#ah)"/>
<text class="lbl" x="379" y="308" text-anchor="middle" dominant-baseline="central">JTAG</text>
<rect class="note" x="40" y="390" width="300" height="59" rx="6"/>
<text class="s" x="50" y="404" text-anchor="start" dominant-baseline="central">XTAG loads a helper into the XVF3800,</text>
<text class="s" x="50" y="419" text-anchor="start" dominant-baseline="central">which writes its own flash. Also gives</text>
<text class="s" x="50" y="434" text-anchor="start" dominant-baseline="central">live debugging. Check XTAG4 at 1.8 V.</text>
<text class="h2" x="760" y="100" text-anchor="start" dominant-baseline="central">Path B: ESP32-S3 (no XMOS hardware)</text>
<rect class="box k-gry" x="760" y="120" width="140" height="70" rx="8"/>
<text class="t" x="830.0" y="147.5" text-anchor="middle" dominant-baseline="central">PC</text>
<text class="s" x="830.0" y="165.5" text-anchor="middle" dominant-baseline="central">sends image</text>
<rect class="box k-mcu" x="930" y="120" width="150" height="70" rx="8"/>
<text class="t" x="1005.0" y="147.5" text-anchor="middle" dominant-baseline="central">ESP32-S3</text>
<text class="s" x="1005.0" y="165.5" text-anchor="middle" dominant-baseline="central">SPI flash writer</text>
<path class="wire mcu" d="M900 155 L928 155" marker-end="url(#ah)"/>
<text class="lbl" x="830" y="205" text-anchor="middle" dominant-baseline="central">image over USB-C (ESP32)</text>
<rect class="box k-prg" x="760" y="290" width="150" height="60" rx="8"/>
<text class="t" x="835.0" y="312.5" text-anchor="middle" dominant-baseline="central">2N7002 Q701</text>
<text class="s" x="835.0" y="330.5" text-anchor="middle" dominant-baseline="central">+ 0 Ω link</text>
<path class="wire mcu" d="M960 190 L960 320 L912 320" marker-end="url(#ah)"/>
<text class="lbl" x="968" y="300" text-anchor="start" dominant-baseline="central">GPIO21</text>
<path class="wire prg" d="M758 320 L642 320" marker-end="url(#ah)"/>
<text class="lbl" x="700" y="308" text-anchor="middle" dominant-baseline="central">RST_N low</text>
<rect class="box k-prg" x="760" y="400" width="320" height="90" rx="8"/>
<text class="t" x="920.0" y="422.5" text-anchor="middle" dominant-baseline="central">4 × TS5A3166 switches</text>
<text class="s" x="920.0" y="440.5" text-anchor="middle" dominant-baseline="central">IN ← JP701 (pull-down = off)</text>
<text class="s" x="920.0" y="455.5" text-anchor="middle" dominant-baseline="central">jumper state → ESP32 GPIO14</text>
<text class="s" x="920.0" y="470.5" text-anchor="middle" dominant-baseline="central">SPI2: 10 CS · 11 MOSI · 12 CLK · 13 MISO</text>
<path class="wire mcu" d="M1050 190 L1050 398" marker-end="url(#ah)"/>
<text class="lbl" x="1044" y="240" text-anchor="end" dominant-baseline="central">GPIO10–13</text>
<path class="wire prg" d="M758 470 L700 470 L700 560 L642 560" marker-end="url(#ah)"/>
<text class="lbl" x="706" y="515" text-anchor="start" dominant-baseline="central">flash lines</text>
<rect class="note" x="40" y="560" width="380" height="122" rx="6"/>
<text class="t" x="50" y="574" text-anchor="start" dominant-baseline="central">Path B step by step</text>
<text class="s" x="50" y="592" text-anchor="start" dominant-baseline="central">1. Fit JP701; ESP32 pulls RST_N low through Q701.</text>
<text class="s" x="50" y="607" text-anchor="start" dominant-baseline="central">2. XVF3800 lets go of the flash pins in reset.</text>
<text class="s" x="50" y="622" text-anchor="start" dominant-baseline="central">3. ESP32 erases + writes the image (standard</text>
<text class="s" x="50" y="637" text-anchor="start" dominant-baseline="central">    W25Q commands), reads it back to check.</text>
<text class="s" x="50" y="652" text-anchor="start" dominant-baseline="central">4. ESP32 releases the lines (59, 60, 1 are boot</text>
<text class="s" x="50" y="667" text-anchor="start" dominant-baseline="central">    straps), then RST_N. XVF3800 boots.</text>
<rect class="note" x="760" y="560" width="320" height="59" rx="6"/>
<text class="s" x="770" y="574" text-anchor="start" dominant-baseline="central">Image = .xe converted to raw flash bytes</text>
<text class="s" x="770" y="589" text-anchor="start" dominant-baseline="central">by XMOS xflash (free tool) on the PC.</text>
<text class="s" x="770" y="604" text-anchor="start" dominant-baseline="central">Verify boot from it on the first board.</text></svg>
