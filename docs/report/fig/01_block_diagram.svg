<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img"><title>MindSpeak rev 1 block diagram</title><desc>XVF3800 voice processor in the centre with USB-C, flash, crystal and JTAG on the left, mics, MAX98357A speaker amp and UI on the right, the power block above and the ESP32-S3 helper module below it with its own USB-C, WS2812 ring, user UI and GPIO headers.</desc>
<style>
  .bg { fill: #ffffff; }
  text { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', Arial, sans-serif; fill: #1f2328; }
  .t  { font-size: 14px; font-weight: 600; }
  .s  { font-size: 11.5px; fill: #3d444d; }
  .xs { font-size: 10px; fill: #57606a; }
  .h1 { font-size: 20px; font-weight: 700; }
  .h2 { font-size: 13px; font-weight: 600; fill: #57606a; letter-spacing: 0.04em; }
  .wire { stroke: #57606a; stroke-width: 1.4; fill: none; }
  .wire.dash { stroke-dasharray: 5 4; }
  .wire.pwr { stroke: #0f766e; stroke-width: 2; }
  .wire.sig { stroke: #1d4ed8; }
  .wire.aud { stroke: #c2410c; }
  .wire.mcu { stroke: #7e22ce; }
  .wire.prg { stroke: #be185d; }
  .lbl { font-size: 10.5px; fill: #3d444d; }
  .box { stroke-width: 1.2; }
  .k-pwr  { fill: #e6f4f1; stroke: #0f766e; }
  .k-xvf  { fill: #e8efff; stroke: #1d4ed8; }
  .k-mcu  { fill: #f3e8ff; stroke: #7e22ce; }
  .k-aud  { fill: #fff1e8; stroke: #c2410c; }
  .k-mic  { fill: #e9f7e6; stroke: #2f7d1f; }
  .k-ui   { fill: #fff7db; stroke: #a16207; }
  .k-prg  { fill: #fde8f1; stroke: #be185d; }
  .k-gry  { fill: #f2f3f5; stroke: #6e7781; }
  .k-dnp  { fill: #ffffff; stroke: #6e7781; stroke-dasharray: 4 3; }
  .note   { fill: #fffbea; stroke: #d4a72c; stroke-width: 1; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#57606a"/></marker></defs><rect class="bg" x="0" y="0" width="1000" height="740"/><text class="h1" x="30" y="28" text-anchor="start" dominant-baseline="central">MindSpeak rev 1: block diagram</text>
<text class="s" x="30" y="52" text-anchor="start" dominant-baseline="central">XVF3800 breakout on stock USB firmware, ESP32-S3 helper module, MAX98357A speaker amp. Updated 2026-11-10.</text>
<rect class="box k-pwr" x="330" y="75" width="320" height="95" rx="8"/>
<text class="t" x="490.0" y="100.0" text-anchor="middle" dominant-baseline="central">Power</text>
<text class="s" x="490.0" y="118.0" text-anchor="middle" dominant-baseline="central">USB-C ×2 → TPS2121 mux → 5 V</text>
<text class="s" x="490.0" y="133.0" text-anchor="middle" dominant-baseline="central">0.9 V buck · 3.3 V buck · 1.8 V LDO</text>
<text class="s" x="490.0" y="148.0" text-anchor="middle" dominant-baseline="central">TPS3808 supervisor on RST_N</text>
<rect class="box k-xvf" x="370" y="230" width="240" height="160" rx="8"/>
<text class="t" x="490.0" y="280.0" text-anchor="middle" dominant-baseline="central">XVF3800-QF60B-C</text>
<text class="s" x="490.0" y="298.0" text-anchor="middle" dominant-baseline="central">XU316 voice processor</text>
<text class="s" x="490.0" y="313.0" text-anchor="middle" dominant-baseline="central">USB audio + control</text>
<text class="s" x="490.0" y="328.0" text-anchor="middle" dominant-baseline="central">AEC, beamforming, NS</text>
<text class="s" x="490.0" y="343.0" text-anchor="middle" dominant-baseline="central">stock firmware</text>
<path class="wire pwr" d="M490 170 L490 228" marker-end="url(#ah)"/>
<text class="lbl" x="482" y="200" text-anchor="end" dominant-baseline="central">0.9 / 1.8 / 3.3 V</text>
<rect class="box k-gry" x="40" y="200" width="190" height="60" rx="8"/>
<text class="t" x="135.0" y="222.5" text-anchor="middle" dominant-baseline="central">USB-C (main)</text>
<text class="s" x="135.0" y="240.5" text-anchor="middle" dominant-baseline="central">host link, priority power</text>
<path class="wire sig" d="M230 230 L368 250" marker-end="url(#ah)"/>
<text class="lbl" x="300" y="228" text-anchor="middle" dominant-baseline="central">USB 2.0 HS (28/29)</text>
<rect class="box k-gry" x="40" y="290" width="190" height="60" rx="8"/>
<text class="t" x="135.0" y="312.5" text-anchor="middle" dominant-baseline="central">QSPI flash</text>
<text class="s" x="135.0" y="330.5" text-anchor="middle" dominant-baseline="central">W25Q32JVUUIQ, 4 MB, USON-8</text>
<path class="wire sig" d="M230 320 L368 320" marker-end="url(#ah)"/>
<text class="lbl" x="300" y="310" text-anchor="middle" dominant-baseline="central">QSPI (1,2,3,5,59,60)</text>
<rect class="box k-gry" x="40" y="375" width="190" height="50" rx="8"/>
<text class="t" x="135.0" y="392.5" text-anchor="middle" dominant-baseline="central">24 MHz crystal</text>
<text class="s" x="135.0" y="410.5" text-anchor="middle" dominant-baseline="central">X322524MOB4SI</text>
<path class="wire sig" d="M230 400 L300 400 L300 370 L368 370" marker-end="url(#ah)"/>
<text class="lbl" x="335" y="360" text-anchor="middle" dominant-baseline="central">XIN/XOUT 16/15</text>
<rect class="box k-prg" x="40" y="450" width="190" height="55" rx="8"/>
<text class="t" x="135.0" y="470.0" text-anchor="middle" dominant-baseline="central">JTAG header</text>
<text class="s" x="135.0" y="488.0" text-anchor="middle" dominant-baseline="central">S7B-PH, 1.8 V, for XTAG4</text>
<path class="wire prg" d="M230 470 L420 470 L420 392" marker-end="url(#ah)"/>
<text class="lbl" x="330" y="460" text-anchor="middle" dominant-baseline="central">TCK/TMS/TDI/TDO/RST_N</text>
<rect class="box k-mic" x="760" y="85" width="200" height="70" rx="8"/>
<text class="t" x="860.0" y="105.0" text-anchor="middle" dominant-baseline="central">4 × PDM mic</text>
<text class="s" x="860.0" y="123.0" text-anchor="middle" dominant-baseline="central">IM69D129F, 66 mm square</text>
<text class="s" x="860.0" y="138.0" text-anchor="middle" dominant-baseline="central">CLK via SN74LVC1G125</text>
<path class="wire sig" d="M758 120 L680 120 L680 205 L570 205 L570 228"/>
<text class="lbl" x="688" y="165" text-anchor="start" dominant-baseline="central">CLK 43</text>
<text class="lbl" x="688" y="180" text-anchor="start" dominant-baseline="central">DATA 46/50/48/51</text>
<rect class="box k-aud" x="760" y="230" width="200" height="60" rx="8"/>
<text class="t" x="860.0" y="252.5" text-anchor="middle" dominant-baseline="central">MAX98357A</text>
<text class="s" x="860.0" y="270.5" text-anchor="middle" dominant-baseline="central">I²S DAC + 3.2 W class-D</text>
<path class="wire aud" d="M612 260 L758 260" marker-end="url(#ah)"/>
<text class="lbl" x="685" y="250" text-anchor="middle" dominant-baseline="central">I²S 9/10/13</text>
<rect class="box k-aud" x="800" y="315" width="160" height="50" rx="8"/>
<text class="t" x="880.0" y="332.5" text-anchor="middle" dominant-baseline="central">Speaker</text>
<text class="s" x="880.0" y="350.5" text-anchor="middle" dominant-baseline="central">CS45, 4 Ω, 5 W</text>
<path class="wire aud" d="M860 290 L860 313" marker-end="url(#ah)"/>
<rect class="box k-ui" x="760" y="390" width="200" height="70" rx="8"/>
<text class="t" x="860.0" y="402.5" text-anchor="middle" dominant-baseline="central">XVF UI</text>
<text class="s" x="860.0" y="420.5" text-anchor="middle" dominant-baseline="central">mute + action buttons (11, 32)</text>
<text class="s" x="860.0" y="435.5" text-anchor="middle" dominant-baseline="central">RGB status LED (56 R, 58 G)</text>
<text class="s" x="860.0" y="450.5" text-anchor="middle" dominant-baseline="central">amp enable (40)</text>
<path class="wire sig" d="M612 350 L700 350 L700 425 L758 425" marker-end="url(#ah)"/>
<text class="lbl" x="650" y="340" text-anchor="middle" dominant-baseline="central">GPI / GPO</text>
<rect class="box k-mcu" x="370" y="545" width="240" height="110" rx="8"/>
<text class="t" x="490.0" y="577.5" text-anchor="middle" dominant-baseline="central">ESP32-S3-WROOM-1U</text>
<text class="s" x="490.0" y="595.5" text-anchor="middle" dominant-baseline="central">N16R8, IPEX antenna (off-board)</text>
<text class="s" x="490.0" y="610.5" text-anchor="middle" dominant-baseline="central">own firmware: LEDs, GPIO, host link</text>
<text class="s" x="490.0" y="625.5" text-anchor="middle" dominant-baseline="central">can reflash the XVF3800</text>
<path class="wire mcu" d="M540 392 L540 543" marker-end="url(#ah)"/>
<text class="lbl" x="548" y="520" text-anchor="start" dominant-baseline="central">taps 55 INT_N, 56 R, 58 G</text>
<path class="wire prg" d="M430 543 L430 393" marker-end="url(#ah)"/>
<text class="lbl" x="422" y="520" text-anchor="end" dominant-baseline="central">RST_N (Q701)</text>
<path class="wire sig" d="M595 392 L595 495 L758 495" marker-end="url(#ah)"/>
<text class="lbl" x="680" y="485" text-anchor="middle" dominant-baseline="central">39/44/45/53/55</text>
<rect class="box k-prg" x="170" y="555" width="150" height="55" rx="8"/>
<text class="t" x="245.0" y="575.0" text-anchor="middle" dominant-baseline="central">Flash switches</text>
<text class="s" x="245.0" y="593.0" text-anchor="middle" dominant-baseline="central">4 × TS5A3166 + JP701</text>
<path class="wire mcu" d="M368 585 L322 585" marker-end="url(#ah)"/>
<text class="lbl" x="345" y="575" text-anchor="middle" dominant-baseline="central">SPI2</text>
<path class="wire prg" d="M245 553 L245 365 L200 365 L200 352" marker-end="url(#ah)"/>
<text class="lbl" x="252" y="420" text-anchor="start" dominant-baseline="central">flash lines</text>
<rect class="box k-gry" x="40" y="650" width="150" height="50" rx="8"/>
<text class="t" x="115.0" y="667.5" text-anchor="middle" dominant-baseline="central">USB-C (ESP32)</text>
<text class="s" x="115.0" y="685.5" text-anchor="middle" dominant-baseline="central">USB FS + power</text>
<path class="wire mcu" d="M190 675 L368 640" marker-end="url(#ah)"/>
<rect class="box k-gry" x="760" y="475" width="200" height="60" rx="8"/>
<text class="t" x="860.0" y="490.0" text-anchor="middle" dominant-baseline="central">Headers</text>
<text class="s" x="860.0" y="508.0" text-anchor="middle" dominant-baseline="central">2×10 J702: GPIO, I²C, XVF taps</text>
<text class="s" x="860.0" y="523.0" text-anchor="middle" dominant-baseline="central">1×6 J701: UART + I²C host</text>
<path class="wire mcu" d="M612 560 L690 560 L690 520 L758 520" marker-end="url(#ah)"/>
<rect class="box k-ui" x="760" y="560" width="200" height="55" rx="8"/>
<text class="t" x="860.0" y="580.0" text-anchor="middle" dominant-baseline="central">WS2812B ring</text>
<text class="s" x="860.0" y="598.0" text-anchor="middle" dominant-baseline="central">12 × 2020, 5 V via buffer</text>
<path class="wire mcu" d="M612 590 L758 588" marker-end="url(#ah)"/>
<rect class="box k-ui" x="760" y="640" width="200" height="75" rx="8"/>
<text class="t" x="860.0" y="655.0" text-anchor="middle" dominant-baseline="central">ESP32 UI</text>
<text class="s" x="860.0" y="673.0" text-anchor="middle" dominant-baseline="central">user RGB LED (own buffer)</text>
<text class="s" x="860.0" y="688.0" text-anchor="middle" dominant-baseline="central">mute LED · user button</text>
<text class="s" x="860.0" y="703.0" text-anchor="middle" dominant-baseline="central">BOOT + EN buttons</text>
<path class="wire mcu" d="M612 630 L700 630 L700 677 L758 677" marker-end="url(#ah)"/></svg>
