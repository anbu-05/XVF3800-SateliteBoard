<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="850" viewBox="0 0 1160 850" role="img"><title>Everything connected to the XVF3800</title><desc>The XVF3800 in the middle with its pin numbers. Left: USB-C, QSPI flash, crystal, reset, JTAG header, ESP32-S3 link and power. Right: four mics behind a clock buffer, MCLK loop, MAX98357A amp, buttons, GPO outputs, the 2x12 header and the solder pads.</desc>
<style>
  .bg { fill: #ffffff; }
  text { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', Arial, sans-serif; fill: #1f2328; }
  .t  { font-size: 14px; font-weight: 600; }
  .s  { font-size: 11.5px; fill: #3d444d; }
  .xs { font-size: 10px; fill: #57606a; }
  .h1 { font-size: 20px; font-weight: 700; }
  .h2 { font-size: 13px; font-weight: 600; fill: #57606a; letter-spacing: 0.04em; }
  .wire { stroke: #57606a; stroke-width: 1.4; fill: none; }
  .wire.dash { stroke-dasharray: 5 4; }
  .wire.pwr { stroke: #0f766e; stroke-width: 2; }
  .wire.sig { stroke: #1d4ed8; }
  .wire.aud { stroke: #c2410c; }
  .wire.mcu { stroke: #7e22ce; }
  .wire.prg { stroke: #be185d; }
  .lbl { font-size: 10.5px; fill: #3d444d; }
  .box { stroke-width: 1.2; }
  .k-pwr  { fill: #e6f4f1; stroke: #0f766e; }
  .k-xvf  { fill: #e8efff; stroke: #1d4ed8; }
  .k-mcu  { fill: #f3e8ff; stroke: #7e22ce; }
  .k-aud  { fill: #fff1e8; stroke: #c2410c; }
  .k-mic  { fill: #e9f7e6; stroke: #2f7d1f; }
  .k-ui   { fill: #fff7db; stroke: #a16207; }
  .k-prg  { fill: #fde8f1; stroke: #be185d; }
  .k-gry  { fill: #f2f3f5; stroke: #6e7781; }
  .k-dnp  { fill: #ffffff; stroke: #6e7781; stroke-dasharray: 4 3; }
  .note   { fill: #fffbea; stroke: #d4a72c; stroke-width: 1; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#57606a"/></marker></defs><rect class="bg" x="0" y="0" width="1160" height="850"/><text class="h1" x="30" y="28" text-anchor="start" dominant-baseline="central">MindSpeak rev 1: everything connected to the XVF3800</text>
<text class="s" x="30" y="52" text-anchor="start" dominant-baseline="central">Numbers on the wires are XVF3800 pins. Updated 2026-11-10: ESP32-S3 link, corrected pins 54/55, mic clock buffer.</text>
<rect class="box k-xvf" x="480" y="80" width="180" height="745" rx="8"/>
<text class="t" x="570.0" y="435" text-anchor="middle" dominant-baseline="central">XVF3800-QF60B-C</text>
<text class="s" x="570.0" y="455" text-anchor="middle" dominant-baseline="central">QFN-60</text>
<text class="s" x="570.0" y="471" text-anchor="middle" dominant-baseline="central">stock USB firmware</text>
<rect class="box k-gry" x="30" y="85" width="280" height="70" rx="8"/>
<text class="t" x="170.0" y="105.0" text-anchor="middle" dominant-baseline="central">USB-C (main)</text>
<text class="s" x="170.0" y="123.0" text-anchor="middle" dominant-baseline="central">TPD4E05U06 ESD, 90 Ω pair</text>
<text class="s" x="170.0" y="138.0" text-anchor="middle" dominant-baseline="central">bus-powered, no VBUS sense</text>
<path class="wire sig" d="M310 120.0 L478 120.0" marker-end="url(#ah)"/>
<text class="lbl" x="395.0" y="111.0" text-anchor="middle" dominant-baseline="central">28 USB_DM · 29 USB_DP</text>
<rect class="box k-gry" x="30" y="175" width="280" height="85" rx="8"/>
<text class="t" x="170.0" y="195.0" text-anchor="middle" dominant-baseline="central">QSPI flash W25Q32JVUUIQ</text>
<text class="s" x="170.0" y="213.0" text-anchor="middle" dominant-baseline="central">CS_N 4.7 kΩ pull-up to 3.3 V</text>
<text class="s" x="170.0" y="228.0" text-anchor="middle" dominant-baseline="central">D1 straight to flash</text>
<text class="s" x="170.0" y="243.0" text-anchor="middle" dominant-baseline="central">* also reachable by the ESP32</text>
<path class="wire sig" d="M310 217.5 L478 217.5" marker-end="url(#ah)"/>
<text class="lbl" x="395.0" y="208.5" text-anchor="middle" dominant-baseline="central">3 CS* · 5 CLK* · 59 D0*</text>
<text class="lbl" x="395.0" y="227.5" text-anchor="middle" dominant-baseline="central">1 D1* · 60 D2 · 2 D3</text>
<rect class="box k-gry" x="30" y="280" width="280" height="70" rx="8"/>
<text class="t" x="170.0" y="300.0" text-anchor="middle" dominant-baseline="central">24 MHz crystal X322524MOB4SI</text>
<text class="s" x="170.0" y="318.0" text-anchor="middle" dominant-baseline="central">Rf 1 MΩ, Rd 680 Ω, 22 pF × 2</text>
<text class="s" x="170.0" y="333.0" text-anchor="middle" dominant-baseline="central">1.8 V domain (bottom bank)</text>
<path class="wire sig" d="M310 315.0 L478 315.0" marker-end="url(#ah)"/>
<text class="lbl" x="395.0" y="306.0" text-anchor="middle" dominant-baseline="central">16 XIN · 15 XOUT</text>
<rect class="box k-prg" x="30" y="370" width="280" height="85" rx="8"/>
<text class="t" x="170.0" y="390.0" text-anchor="middle" dominant-baseline="central">Reset (RST_N, 1.8 V)</text>
<text class="s" x="170.0" y="408.0" text-anchor="middle" dominant-baseline="central">TPS3808G33 open drain + 10 kΩ to 1.8 V</text>
<text class="s" x="170.0" y="423.0" text-anchor="middle" dominant-baseline="central">reset button on MR</text>
<text class="s" x="170.0" y="438.0" text-anchor="middle" dominant-baseline="central">ESP32 GPIO21 → 2N7002 Q701 · XTAG</text>
<path class="wire prg" d="M310 412.5 L478 412.5" marker-end="url(#ah)"/>
<text class="lbl" x="395.0" y="403.5" text-anchor="middle" dominant-baseline="central">21 RST_N</text>
<rect class="box k-prg" x="30" y="475" width="280" height="70" rx="8"/>
<text class="t" x="170.0" y="495.0" text-anchor="middle" dominant-baseline="central">JTAG header S7B-PH-SM4-TB</text>
<text class="s" x="170.0" y="513.0" text-anchor="middle" dominant-baseline="central">1.8 V signals, for an XTAG4</text>
<text class="s" x="170.0" y="528.0" text-anchor="middle" dominant-baseline="central">+ parallel solder pads</text>
<path class="wire prg" d="M310 510.0 L478 510.0" marker-end="url(#ah)"/>
<text class="lbl" x="395.0" y="501.0" text-anchor="middle" dominant-baseline="central">24 TCK · 23 TMS</text>
<text class="lbl" x="395.0" y="520.0" text-anchor="middle" dominant-baseline="central">18 TDI · 20 TDO</text>
<rect class="box k-mcu" x="30" y="565" width="280" height="115" rx="8"/>
<text class="t" x="170.0" y="592.5" text-anchor="middle" dominant-baseline="central">ESP32-S3 link</text>
<text class="s" x="170.0" y="610.5" text-anchor="middle" dominant-baseline="central">4 × TS5A3166 switches on 3, 5, 59, 1</text>
<text class="s" x="170.0" y="625.5" text-anchor="middle" dominant-baseline="central">(PROG switch SW701 = on; off by default)</text>
<text class="s" x="170.0" y="640.5" text-anchor="middle" dominant-baseline="central">taps: 56 R → GPIO15, 58 G → GPIO16</text>
<text class="s" x="170.0" y="655.5" text-anchor="middle" dominant-baseline="central">55 INT_N → GPIO17</text>
<path class="wire mcu" d="M310 622.5 L478 622.5" marker-end="url(#ah)"/>
<text class="lbl" x="395.0" y="613.5" text-anchor="middle" dominant-baseline="central">switched: 3 · 5 · 59 · 1</text>
<text class="lbl" x="395.0" y="632.5" text-anchor="middle" dominant-baseline="central">taps: 55 · 56 · 58</text>
<rect class="box k-pwr" x="30" y="700" width="280" height="100" rx="8"/>
<text class="t" x="170.0" y="720.0" text-anchor="middle" dominant-baseline="central">Power</text>
<text class="s" x="170.0" y="738.0" text-anchor="middle" dominant-baseline="central">VDD 0.9 V: 4,12,19,27,34,42,49,57,61–64</text>
<text class="s" x="170.0" y="753.0" text-anchor="middle" dominant-baseline="central">PLL_AVDD 22: ferrite + 1 µF</text>
<text class="s" x="170.0" y="768.0" text-anchor="middle" dominant-baseline="central">VDDIOL/R/T 8,38,52 · USB_VDD33 30: 3.3 V</text>
<text class="s" x="170.0" y="783.0" text-anchor="middle" dominant-baseline="central">VDDIOB18 17,26 · USB_VDD18 31: 1.8 V</text>
<path class="wire pwr" d="M310 750.0 L478 750.0" marker-end="url(#ah)"/>
<text class="lbl" x="395.0" y="741.0" text-anchor="middle" dominant-baseline="central">power pins</text>
<text class="lbl" x="395.0" y="760.0" text-anchor="middle" dominant-baseline="central">GND paddle 65</text>
<rect class="box k-mic" x="830" y="85" width="300" height="100" rx="8"/>
<text class="t" x="980.0" y="105.0" text-anchor="middle" dominant-baseline="central">4 × IM69D129F PDM mic</text>
<text class="s" x="980.0" y="123.0" text-anchor="middle" dominant-baseline="central">43 → SN74LVC1G125 → 100 Ω → 100 Ω per mic</text>
<text class="s" x="980.0" y="138.0" text-anchor="middle" dominant-baseline="central">DATA 100 Ω series per mic:</text>
<text class="s" x="980.0" y="153.0" text-anchor="middle" dominant-baseline="central">mic 0 → 46, 1 → 50, 2 → 48, 3 → 51</text>
<text class="s" x="980.0" y="168.0" text-anchor="middle" dominant-baseline="central">SELECT → GND, 3.3 V via ferrite</text>
<path class="wire sig" d="M660 135.0 L828 135.0" marker-end="url(#ah)"/>
<text class="lbl" x="745.0" y="126.0" text-anchor="middle" dominant-baseline="central">43 CLK</text>
<text class="lbl" x="745.0" y="145.0" text-anchor="middle" dominant-baseline="central">46 · 50 · 48 · 51</text>
<rect class="box k-gry" x="830" y="205" width="300" height="70" rx="8"/>
<text class="t" x="980.0" y="225.0" text-anchor="middle" dominant-baseline="central">MCLK loop (PCB trace)</text>
<text class="s" x="980.0" y="243.0" text-anchor="middle" dominant-baseline="central">pin 14 MCLK out → pin 41 MCLK in</text>
<text class="s" x="980.0" y="258.0" text-anchor="middle" dominant-baseline="central">test pad on 14</text>
<path class="wire sig" d="M660 240.0 L828 240.0" marker-end="url(#ah)"/>
<text class="lbl" x="745.0" y="231.0" text-anchor="middle" dominant-baseline="central">14 → 41</text>
<rect class="box k-aud" x="830" y="295" width="300" height="85" rx="8"/>
<text class="t" x="980.0" y="315.0" text-anchor="middle" dominant-baseline="central">MAX98357AEWL+T</text>
<text class="s" x="980.0" y="333.0" text-anchor="middle" dominant-baseline="central">I²S DAC + class-D amp, 5 V via TPS22918</text>
<text class="s" x="980.0" y="348.0" text-anchor="middle" dominant-baseline="central">SD_MODE resistor, GAIN pin</text>
<text class="s" x="980.0" y="363.0" text-anchor="middle" dominant-baseline="central">test pads on 9, 10, 13</text>
<path class="wire aud" d="M660 337.5 L828 337.5" marker-end="url(#ah)"/>
<text class="lbl" x="745.0" y="328.5" text-anchor="middle" dominant-baseline="central">9 DATA0 · 10 LRCK</text>
<text class="lbl" x="745.0" y="347.5" text-anchor="middle" dominant-baseline="central">13 BCLK</text>
<rect class="box k-ui" x="830" y="400" width="300" height="70" rx="8"/>
<text class="t" x="980.0" y="420.0" text-anchor="middle" dominant-baseline="central">Side buttons TS24CA</text>
<text class="s" x="980.0" y="438.0" text-anchor="middle" dominant-baseline="central">active low, 10 kΩ pull-ups</text>
<text class="s" x="980.0" y="453.0" text-anchor="middle" dominant-baseline="central">mute = 11, action = 32</text>
<path class="wire sig" d="M660 435.0 L828 435.0" marker-end="url(#ah)"/>
<text class="lbl" x="745.0" y="426.0" text-anchor="middle" dominant-baseline="central">11 · 32</text>
<rect class="box k-ui" x="830" y="490" width="300" height="85" rx="8"/>
<text class="t" x="980.0" y="510.0" text-anchor="middle" dominant-baseline="central">GPO outputs (stock firmware)</text>
<text class="s" x="980.0" y="528.0" text-anchor="middle" dominant-baseline="central">40 → amp load switch EN</text>
<text class="s" x="980.0" y="543.0" text-anchor="middle" dominant-baseline="central">56 R · 58 G → RGB status LED (blue unused)</text>
<text class="s" x="980.0" y="558.0" text-anchor="middle" dominant-baseline="central">56/58 also tapped by the ESP32</text>
<path class="wire sig" d="M660 532.5 L828 532.5" marker-end="url(#ah)"/>
<text class="lbl" x="745.0" y="523.5" text-anchor="middle" dominant-baseline="central">40</text>
<text class="lbl" x="745.0" y="542.5" text-anchor="middle" dominant-baseline="central">56 · 58</text>
<rect class="box k-gry" x="830" y="595" width="300" height="100" rx="8"/>
<text class="t" x="980.0" y="615.0" text-anchor="middle" dominant-baseline="central">2×12 header J701</text>
<text class="s" x="980.0" y="633.0" text-anchor="middle" dominant-baseline="central">39 I2S_DATA1 · 53 I2S_DATA2</text>
<text class="s" x="980.0" y="648.0" text-anchor="middle" dominant-baseline="central">44 SCL / 45 SDA (no pull-ups; shunts</text>
<text class="s" x="980.0" y="663.0" text-anchor="middle" dominant-baseline="central">on 13–14, 15–16 join the ESP32 I²C)</text>
<text class="s" x="980.0" y="678.0" text-anchor="middle" dominant-baseline="central">55 INT_N (also ESP32 GPIO17)</text>
<path class="wire sig" d="M660 645.0 L828 645.0" marker-end="url(#ah)"/>
<text class="lbl" x="745.0" y="636.0" text-anchor="middle" dominant-baseline="central">39 · 53 · 44 · 45</text>
<text class="lbl" x="745.0" y="655.0" text-anchor="middle" dominant-baseline="central">55</text>
<rect class="box k-dnp" x="830" y="715" width="300" height="100" rx="8"/>
<text class="t" x="980.0" y="742.5" text-anchor="middle" dominant-baseline="central">Solder pads / not connected</text>
<text class="s" x="980.0" y="760.5" text-anchor="middle" dominant-baseline="central">6/7/47 SPI CS/MOSI/MISO · 54 SQ_nLIN</text>
<text class="s" x="980.0" y="775.5" text-anchor="middle" dominant-baseline="central">33/35/36/37 XLINK (debug)</text>
<text class="s" x="980.0" y="790.5" text-anchor="middle" dominant-baseline="central">25 NC: leave unconnected</text>
<path class="wire dash" d="M660 765.0 L828 765.0" marker-end="url(#ah)"/>
<text class="lbl" x="745.0" y="756.0" text-anchor="middle" dominant-baseline="central">6 · 7 · 47 · 54</text>
<text class="lbl" x="745.0" y="775.0" text-anchor="middle" dominant-baseline="central">33–37 · (25 NC)</text></svg>
