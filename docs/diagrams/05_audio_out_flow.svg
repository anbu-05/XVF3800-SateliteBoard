<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><title>USB audio-out flow</title><desc>The host sends playback audio over USB. The XVF3800 keeps a copy as the echo reference and sends the same audio out as I2S on pins 9, 10 and 13 to the MAX98357A, which drives the speaker. The speaker sound reaches the mics as echo; the XVF3800 removes it and sends clean voice back.</desc>
<style>
  .bg { fill: #ffffff; }
  text { font-family: 'Inter', 'Segoe UI', 'DejaVu Sans', Arial, sans-serif; fill: #1f2328; }
  .t  { font-size: 14px; font-weight: 600; }
  .s  { font-size: 11.5px; fill: #3d444d; }
  .xs { font-size: 10px; fill: #57606a; }
  .h1 { font-size: 20px; font-weight: 700; }
  .h2 { font-size: 13px; font-weight: 600; fill: #57606a; letter-spacing: 0.04em; }
  .wire { stroke: #57606a; stroke-width: 1.4; fill: none; }
  .wire.dash { stroke-dasharray: 5 4; }
  .wire.pwr { stroke: #0f766e; stroke-width: 2; }
  .wire.sig { stroke: #1d4ed8; }
  .wire.aud { stroke: #c2410c; }
  .wire.mcu { stroke: #7e22ce; }
  .wire.prg { stroke: #be185d; }
  .lbl { font-size: 10.5px; fill: #3d444d; }
  .box { stroke-width: 1.2; }
  .k-pwr  { fill: #e6f4f1; stroke: #0f766e; }
  .k-xvf  { fill: #e8efff; stroke: #1d4ed8; }
  .k-mcu  { fill: #f3e8ff; stroke: #7e22ce; }
  .k-aud  { fill: #fff1e8; stroke: #c2410c; }
  .k-mic  { fill: #e9f7e6; stroke: #2f7d1f; }
  .k-ui   { fill: #fff7db; stroke: #a16207; }
  .k-prg  { fill: #fde8f1; stroke: #be185d; }
  .k-gry  { fill: #f2f3f5; stroke: #6e7781; }
  .k-dnp  { fill: #ffffff; stroke: #6e7781; stroke-dasharray: 4 3; }
  .note   { fill: #fffbea; stroke: #d4a72c; stroke-width: 1; }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9z" fill="#57606a"/></marker></defs><rect class="bg" x="0" y="0" width="1000" height="470"/><text class="h1" x="30" y="28" text-anchor="start" dominant-baseline="central">MindSpeak rev 1: how audio gets out</text>
<text class="s" x="30" y="52" text-anchor="start" dominant-baseline="central">The XVF3800 has no DAC. It is the I²S master; the MAX98357A turns I²S into speaker drive. Updated 2026-11-10.</text>
<rect class="box k-gry" x="30" y="150" width="170" height="80" rx="8"/>
<text class="t" x="115.0" y="182.5" text-anchor="middle" dominant-baseline="central">USB host</text>
<text class="s" x="115.0" y="200.5" text-anchor="middle" dominant-baseline="central">PC now, CM5 in rev 2</text>
<rect class="box k-xvf" x="300" y="120" width="230" height="140" rx="8"/>
<text class="t" x="415.0" y="160.0" text-anchor="middle" dominant-baseline="central">XVF3800</text>
<text class="s" x="415.0" y="178.0" text-anchor="middle" dominant-baseline="central">keeps playback as the</text>
<text class="s" x="415.0" y="193.0" text-anchor="middle" dominant-baseline="central">echo reference (AEC)</text>
<text class="s" x="415.0" y="208.0" text-anchor="middle" dominant-baseline="central">I²S master, 48 kHz</text>
<text class="s" x="415.0" y="223.0" text-anchor="middle" dominant-baseline="central">BCLK 3.072 MHz</text>
<path class="wire sig" d="M200 175 L298 175" marker-end="url(#ah)"/>
<text class="lbl" x="249" y="162" text-anchor="middle" dominant-baseline="central">playback (USB)</text>
<path class="wire sig" d="M298 210 L200 210" marker-end="url(#ah)"/>
<text class="lbl" x="249" y="226" text-anchor="middle" dominant-baseline="central">clean voice (USB)</text>
<rect class="box k-aud" x="630" y="130" width="200" height="120" rx="8"/>
<text class="t" x="730.0" y="167.5" text-anchor="middle" dominant-baseline="central">MAX98357A</text>
<text class="s" x="730.0" y="185.5" text-anchor="middle" dominant-baseline="central">I²S DAC + class-D</text>
<text class="s" x="730.0" y="200.5" text-anchor="middle" dominant-baseline="central">≈3.2 W into 4 Ω at 5 V</text>
<text class="s" x="730.0" y="215.5" text-anchor="middle" dominant-baseline="central">GAIN pin, SD_MODE (L/R/mix)</text>
<path class="wire aud" d="M530 165 L628 165" marker-end="url(#ah)"/>
<text class="lbl" x="579" y="155" text-anchor="middle" dominant-baseline="central">9 I2S_DATA0</text>
<path class="wire aud" d="M530 190 L628 190" marker-end="url(#ah)"/>
<text class="lbl" x="579" y="180" text-anchor="middle" dominant-baseline="central">10 LRCK 48 kHz</text>
<path class="wire aud" d="M530 215 L628 215" marker-end="url(#ah)"/>
<text class="lbl" x="579" y="205" text-anchor="middle" dominant-baseline="central">13 BCLK</text>
<rect class="box k-aud" x="870" y="150" width="110" height="80" rx="8"/>
<text class="t" x="925.0" y="175.0" text-anchor="middle" dominant-baseline="central">Speaker</text>
<text class="s" x="925.0" y="193.0" text-anchor="middle" dominant-baseline="central">CS45, 4 Ω</text>
<text class="s" x="925.0" y="208.0" text-anchor="middle" dominant-baseline="central">JST + pads</text>
<path class="wire aud" d="M830 190 L868 190" marker-end="url(#ah)"/>
<rect class="box k-mic" x="300" y="340" width="230" height="70" rx="8"/>
<text class="t" x="415.0" y="367.5" text-anchor="middle" dominant-baseline="central">4 × PDM mic</text>
<text class="s" x="415.0" y="385.5" text-anchor="middle" dominant-baseline="central">voice + speaker echo</text>
<path class="wire sig" d="M415 338 L415 262" marker-end="url(#ah)"/>
<text class="lbl" x="425" y="300" text-anchor="start" dominant-baseline="central">PDM 43/46/50/48/51</text>
<path class="wire dash aud" d="M925 232 L925 375 L532 375" marker-end="url(#ah)"/>
<text class="lbl" x="730" y="362" text-anchor="middle" dominant-baseline="central">echo through the air</text>
<rect class="note" x="630" y="280" width="230" height="59" rx="6"/>
<text class="s" x="640" y="294" text-anchor="start" dominant-baseline="central">No MCLK and no I²C needed.</text>
<text class="s" x="640" y="309" text-anchor="start" dominant-baseline="central">Power from 5 V via TPS22918</text>
<text class="s" x="640" y="324" text-anchor="start" dominant-baseline="central">(EN = XVF pin 40).</text></svg>
